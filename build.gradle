plugins { id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' }
version = '0.10.0'
group = 'dev.coreviewer'
base { archivesName = 'coreviewer-investigator' }
repositories {
    mavenCentral()
    maven { url = 'https://maven.terraformersmc.com/' }
    maven { url = 'https://maven.shedaniel.me/' }
}
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.3'
    implementation('me.shedaniel.cloth:cloth-config-fabric:26.3.158') { transitive = false }
    compileOnly 'me.shedaniel.cloth:basic-math:0.6.1'
    implementation 'com.terraformersmc:modmenu:21.0.0'
    implementation 'org.apache.poi:poi-ooxml:5.5.1'
    // Loom's include is non-transitive; bundle POI's runtime graph for client installations.
    include 'org.apache.poi:poi-ooxml:5.5.1'
    include 'org.apache.poi:poi:5.5.1'
    include 'org.apache.poi:poi-ooxml-lite:5.5.1'
    include 'org.apache.xmlbeans:xmlbeans:5.3.0'
    include 'org.apache.commons:commons-compress:1.28.0'
    include 'org.apache.commons:commons-collections4:4.5.0'
    include 'org.apache.commons:commons-lang3:3.18.0'
    include 'org.apache.commons:commons-math3:3.6.1'
    include 'commons-io:commons-io:2.21.0'
    include 'commons-codec:commons-codec:1.20.0'
    include 'com.zaxxer:SparseBitSet:1.3'
    include 'com.github.virtuald:curvesapi:1.08'
    include 'org.apache.logging.log4j:log4j-api:2.24.3'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
test { useJUnitPlatform() }
fabricApi.configureTests {
    createSourceSet = true
    modId = 'coreviewer-test'
    enableClientGameTests = true
    enableGameTests = false
    eula = true
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
jar { from('LICENSE') }


loom { accessWidenerPath = file('src/main/resources/coreviewer.accesswidener') }


// Optional focused client scenario; omitting the property restores the complete suite.
processGametestResources {
    def selectedTest = providers.gradleProperty('coreviewerTestClass').orElse('')
    inputs.property('selectedTest', selectedTest)
    doLast {
        if (!selectedTest.get().isEmpty()) {
            def descriptor = new File(destinationDir, 'fabric.mod.json')
            def metadata = new groovy.json.JsonSlurper().parse(descriptor)
            def tests = metadata.entrypoints['fabric-client-gametest']
            if (!tests.contains(selectedTest.get())) throw new GradleException('Unknown client scenario: ' + selectedTest.get())
            metadata.entrypoints['fabric-client-gametest'] = [selectedTest.get()]
            descriptor.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata)), 'UTF-8')
        }
    }
}
