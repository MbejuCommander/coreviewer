plugins { id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' }
version = '0.6.1'
group = 'dev.coreviewer'
base { archivesName = 'coreviewer-investigator' }
repositories {
    maven { url = 'https://maven.terraformersmc.com/' }
    maven { url = 'https://maven.shedaniel.me/' }
}
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.3'
    implementation('me.shedaniel.cloth:cloth-config-fabric:26.3.158') { transitive = false }
    compileOnly 'me.shedaniel.cloth:basic-math:0.6.1'
    implementation 'com.terraformersmc:modmenu:21.0.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
test { useJUnitPlatform() }
fabricApi.configureTests {
    createSourceSet = true
    modId = 'coreviewer-test'
    enableClientGameTests = true
    enableGameTests = false
    eula = true
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
jar { from('LICENSE') }


loom { accessWidenerPath = file('src/main/resources/coreviewer.accesswidener') }

